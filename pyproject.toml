[build-system]
requires = ["setuptools >= 61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nist_cdsaxs"
version = "0.1.0"
description = "CD-SAXS data reduction from detector to sample coordinate space."
license = {text = "Public Domain"}
authors = [
    {name="Dean DeLongchamp", email="dean.delongchamp@nist.gov"},
    {name="R. Joseph Kline", email="r.kline@nist.gov"},
    {name="Dan Sunday", email="daniel.sunday@nist.gov},
    {name="Matthew A. Wade", email="matthew.wade@nist.gov"},
    {name="Caitlyn Wolf", email="caitlyn.wolf@nist.gov"},
]
maintainers = [
    {name="Dan Sunday", email="daniel.sunday@nist.gov},
    {name="Matthew A. Wade", email="matthew.wade@nist.gov"},
    {name="Caitlyn Wolf", email="caitlyn.wolf@nist.gov"},
]
requires-python=">=3.10"
dependencies = [
    "numpy>=1.18.0",
    "scipy>=1.4.0",
    "matplotlib>=3.0.0",
    "pandas>=0.25.0",
    "tifffile>=2019.7.0",
    "pillow>=7.0.0",
    "plotly>=6.0.0",
    "seaborn>=0.11.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "flake8>=7.0.0",
    "jupyterlab>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/usnistgov/nist_cdsaxs"
Repository = "https://github.com/usnistgov/nist_cdsaxs"
Documentation = "https://github.com/usnistgov/nist_cdsaxs"
"Bug Tracker" = "https://github.com/usnistgov/nist_cdsaxs/issues"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cdsaxs*"]

[tool.setuptools.package-data]
cdsaxs = ["*.yaml", "*.yml", "*.json", "*.txt", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "*.egg-info"]